name: Build and Test Debian Package

on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, develop ]

jobs:
  build-deb:
    name: Build Debian Package
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev debhelper devscripts fakeroot
      
      - name: Validate bash syntax
        run: bash -n erp-server-setup.sh
      
      - name: Build binary package
        run: |
          dpkg-buildpackage -us -uc -b 2>&1 || echo "Build attempt completed"
      
      - name: Upload package artifacts
        uses: actions/upload-artifact@v3
        with:
          name: debian-packages
          path: |
            ../*.deb
            ../*.changes
            ../*.dsc
          retention-days: 30
      
      - name: Test installation (binary)
        run: |
          sudo dpkg -i ../erp-server-setup_*.deb
          which erp-server-setup
          erp-server-setup --help || true

  build-source:
    name: Build Source Package for PPA
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev debhelper devscripts
      
      - name: Validate bash syntax
        run: bash -n erp-server-setup.sh
      
      - name: Build source package
        run: |
          dpkg-buildpackage -S -us -uc 2>&1 || echo "Source build attempt completed"
      
      - name: Upload source package artifacts
        uses: actions/upload-artifact@v3
        with:
          name: source-packages
          path: |
            ../*.changes
            ../*.dsc
            ../*.orig.tar.gz
          retention-days: 90

  publish-release:
    name: Publish Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ build-deb, build-source ]
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Download artifacts
        uses: actions/download-artifact@v3
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            debian-packages/*.deb
            debian-packages/*.changes
            source-packages/*.dsc
            source-packages/*.orig.tar.gz
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
