theme: jekyll-theme-minimal
title: ERP Server Setup
description: Script profissional de configuração automatizada para servidores Linux
url: https://eltongomez.github.io/server-setup
baseurl: /server-setup
logo: 

# Metadata
author:
  name: Elton Gomez
  email: eltongslima@hotmail.com
  github: eltongomez

# Build settings
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Navigation
nav:
  - title: Início
    url: /server-setup/
  - title: Quick Start
    url: /server-setup/docs/
  - title: Documentação
    url: /server-setup/docs/
  - title: GitHub
    url: https://github.com/eltongomez/server-setup

# Exclude files
exclude:
  - .gitignore
  - .github/
  - CHANGELOG.md
  - CONTRIBUTING.md
  - GIT_SETUP_GUIDE.md
  - CONFIGURATIONS.md
  - MAINTENANCE_GUIDE.md
  - PROFESSIONALIZATION_REPORT.md
  - package.json
  - debian/
  - scripts/
  - tests/
  - .editorconfig
  - .markdownlintrc

